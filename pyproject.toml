[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adit-corpus-indexing"
version = "0.1.0"
description = "LO17 - ADIT corpus preparation: parse HTML bulletins and build an indexable XML file."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "jupyter>=1.1.1",
    "lxml>=6.0.2",
    "matplotlib>=3.10.8",
    "nltk>=3.9.4",
    "snowball>=0.5.6",
    "spacy>=3.8.11",
]

[project.scripts]
td1           = "adit_corpus_indexing.td1_pipeline:main"
td2           = "adit_corpus_indexing.td2_pipeline:main"
adit-pipeline = "adit_corpus_indexing.full_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adit_corpus_indexing = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["adit_corpus_indexing", "backup"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=adit_corpus_indexing --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["*/td1_pipeline.py", "*/td2_pipeline.py", "*/full_pipeline.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.4",
    "types-beautifulsoup4>=4.12.0.20250516",
]
